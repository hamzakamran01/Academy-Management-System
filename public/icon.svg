    </linearGradient>
    <linearGradient id="kms-leaf" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14a06b"/>
      <stop offset="1" stop-color="#6be3b0"/>
    </linearGradient>
    <linearGradient id="kms-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe2ff"/>
    </linearGradient>
    <radialGradient id="kms-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#kms-bg)"/>
  <circle cx="32.5" cy="27" r="17" fill="url(#kms-halo)"/>
