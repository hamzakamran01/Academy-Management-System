<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="kms-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f54de"/>
      <stop offset="1" stop-color="#26267f"/>
    </linearGradient>
    <linearGradient id="kms-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef0ff"/>
