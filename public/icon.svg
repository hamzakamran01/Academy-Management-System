  <path d="M32 27.5c1.9 2.6 4.6 4.3 4.6 7.6 0 2.7-2 4.6-4.6 4.6s-4.6-1.9-4.6-4.6c0-3.3 2.7-5 4.6-7.6z" fill="#7b82f2" opacity="0.5"/>
