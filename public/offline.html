<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Campusly</title>
    <style>
      :root { color-scheme: light dark; --bg: #f8f9fc; --fg: #1d2033; --muted: #5b6075; --primary: #4f52d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #13151f; --fg: #eceef6; --muted: #a8adc2; --primary: #8b91f2; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; text-align: center; }
      .card { max-width: 340px; }
      img { width: 56px; height: 56px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Drafts you started are saved on this phone and will be sent when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
