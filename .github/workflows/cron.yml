# Calls the scheduler tick every 15 minutes (free on GitHub; Vercel Hobby only allows daily crons).
# Repo secrets needed: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same value as in Vercel).
name: Scheduler tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/v1/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set — skipping."; exit 0
          fi
          curl -fsS --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/v1/cron/tick"
